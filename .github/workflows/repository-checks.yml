name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Python syntax
        run: >-
          python3 -c "import ast, pathlib;
          [ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          for p in pathlib.Path('scripts').rglob('*.py')]"
      - name: Check tooling regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p test_tooling.py
          python3 -m unittest discover -s scripts/tests -p test_android_artifacts.py
          python3 -m unittest discover -s scripts/tests -p test_android_host_tools.py
          python3 -m unittest discover -s scripts/tests -p test_android_sdk_reports.py
          python3 -m unittest discover -s scripts/tests -p test_android_baselines.py
          python3 -m unittest discover -s scripts/tests -p test_android_timed_sync.py
          python3 -m unittest discover -s scripts/tests -p test_android_cpu.py
          python3 -m unittest discover -s scripts/tests -p test_android_native_abi.py
          python3 -m unittest discover -s scripts/tests -p test_android_elf.py
          python3 -m unittest discover -s scripts/tests -p test_android_clang_wrapper.py
          python3 -m unittest discover -s scripts/tests -p test_android_generic_atomics.py
          python3 -m unittest discover -s scripts/tests -p test_android_sound_cache.py
          python3 -m unittest discover -s scripts/tests -p test_android_sound_cache_series.py
          python3 -m unittest discover -s scripts/tests -p test_android_api21_sound_cache.py
          python3 -m unittest discover -s scripts/tests -p test_android_api21_forward.py
          python3 -m unittest discover -s scripts/tests -p test_android_api21_exit.py
          python3 -m unittest discover -s scripts/tests -p test_android_media.py
          python3 -m unittest discover -s scripts/tests -p test_android_emulator_identity.py
          python3 -m unittest discover -s scripts/tests -p test_android_legacy_results.py
          python3 -m unittest discover -s scripts/tests -p test_qt4_android_cache.py
          python3 -m unittest discover -s scripts/tests -p test_android_make.py
          python3 -m unittest discover -s scripts/tests -p test_android_result_state.py
          python3 -m unittest discover -s scripts/tests -p test_android_process_exit.py
          python3 -m unittest discover -s scripts/tests -p test_android_owned_process.py
          python3 -m unittest discover -s scripts/tests -p test_android_selftest_profiles.py
      - name: Check Android phase routing
        shell: pwsh
        run: |
          ./scripts/tests/test-qt4-android-modes.ps1
          ./scripts/tests/test-qt5-android-modes.ps1
          ./scripts/tests/test-qt5-android-legacy-suite.ps1
          ./scripts/tests/test-qt6-android-modes.ps1
          ./scripts/tests/test-android-generation.ps1
          ./scripts/tests/test-android-artifact-lock.ps1
          ./scripts/tests/test-android-owned-process.ps1
          ./scripts/tests/test-android-result-state.ps1
          ./scripts/tests/test-android-emulator-state.ps1
          ./scripts/tests/test-android-api21-launch.ps1
          ./scripts/tests/test-android-cpu.ps1
          ./scripts/tests/test-android-case-state.ps1
          ./scripts/tests/test-android-api10-case.ps1
          ./scripts/tests/test-android-sound-cache-series.ps1
          ./scripts/tests/test-android-api21-suite.ps1
          ./scripts/tests/test-android-api21-log.ps1
          ./scripts/tests/test-android-process-exit.ps1
          ./scripts/tests/test-android-exit-query.ps1
          ./scripts/tests/test-android-wait-boot.ps1
          ./scripts/tests/test-android-package-policy.ps1
          ./scripts/tests/test-android-guest-awake.ps1
          ./scripts/tests/test-android-adb-endpoint.ps1
          ./scripts/tests/test-android-adb.ps1
          ./scripts/tests/test-android-shell-status.ps1
      - name: Check API coverage inventory
        run: python3 scripts/tests/check_coverage.py --gate
      - name: Check license matrix
        run: |
          python3 -m json.tool licenses/module-matrix.json > /dev/null
          python3 scripts/licenses/report.py --qt 4 --json > /dev/null
          python3 scripts/licenses/report.py --qt 5 --json > /dev/null
          python3 scripts/licenses/report.py --qt 6 --json > /dev/null
      - name: Scan for host paths, keys and other leaks
        run: python3 scripts/audit/repo_scan.py --spdx
