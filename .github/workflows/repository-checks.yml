name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Python syntax
        run: >-
          python3 -c "import ast, pathlib;
          [ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          for p in pathlib.Path('scripts').rglob('*.py')]"
      - name: Check tooling regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p test_tooling.py
          python3 -m unittest discover -s scripts/tests/android -p 'test_*.py'
      - name: Check x86 futex syscall behavior
        run: python3 scripts/tests/android/qt5-android-futex.py patches/qt5/android/x86/01-api10-futex-stub.patch "$RUNNER_TEMP/qt5-futex" --compiler g++
      - name: Check Android phase routing
        shell: pwsh
        run: |
          foreach ($test in Get-ChildItem scripts/tests/android/test-*.ps1 -File | Sort-Object Name) {
            & $test.FullName
            if (!$?) { throw "Android tooling fixture failed: $($test.Name)" }
          }
      - name: Check Android thread stack alignment
        run: python3 scripts/tests/android/qt5-android-thread-stack.py patches/qt5/android/22-android-thread-stack-size.patch "$RUNNER_TEMP/qt5-thread-stack"
      - name: Install host TTS regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev openjdk-21-jdk-headless
      - name: Check Android TTS callback generations
        run: python3 scripts/tests/android/qt5-android-tts.py "$RUNNER_TEMP/qt5-tts" --qmake qmake
      - name: Check Android explicit main-return shutdown
        run: python3 scripts/tests/android/qt5-android-activity.py "$RUNNER_TEMP/qt5-activity"
      - name: Check Android ServiceConnection owner cleanup
        run: python3 scripts/tests/android/qt5-android-service-connection.py "$RUNNER_TEMP/qt5-service-connection"
      - name: Check API coverage inventory
        run: python3 scripts/tests/check_coverage.py --gate
      - name: Check license matrix
        run: |
          python3 -m json.tool licenses/module-matrix.json > /dev/null
          python3 scripts/licenses/report.py --qt 4 --json > /dev/null
          python3 scripts/licenses/report.py --qt 5 --json > /dev/null
          python3 scripts/licenses/report.py --qt 6 --json > /dev/null
      - name: Scan for host paths, keys and other leaks
        run: python3 scripts/audit/repo_scan.py --spdx
