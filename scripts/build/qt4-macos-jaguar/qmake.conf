include(../macx-g++/qmake.conf)
# Mac OS X 10.2 Jaguar / PowerPC with the Jaguar GCC 5.5 (750, 64-bit long
# double, no __cxa_atexit). Headers and framework stubs come from the 10.4u SDK
# so that 10.3 and 10.4 APIs become weak imports with a 10.2 deployment
# target; see docs/targets/qt4-macos.md.
#
# The Jaguar compiler's include-fixed headers were generated from the 10.2.8
# SDK and do not match 10.4u headers (runetype.h needs machine/ansi.h).
# -nostdinc drops them; the Tiger compiler's include-fixed, generated from
# 10.4u by the same GCC 5.5, takes their place. libSystem resolves from
# the 10.4u SDK as well (see QMAKE_LFLAGS); a strong reference to a
# libSystem function newer than 10.2 is caught by check-imports.sh.
JAGUAR_SDK = /opt/osxcross-ppc/target/SDK/MacOSX10.4u.sdk
JAGUAR_GCC = /opt/jaguar-gcc/lib/gcc/powerpc-apple-darwin8/5.5.0
JAGUAR_CXX = /opt/jaguar-gcc/powerpc-apple-darwin8/include/c++/5.5.0
TIGER_FIXED = /opt/osxcross-ppc/target/lib/gcc/powerpc-apple-darwin8/5.5.0/include-fixed
JAGUAR_INC = -isysroot $$JAGUAR_SDK -nostdinc \
    -isystem $$JAGUAR_CXX -isystem $$JAGUAR_CXX/powerpc-apple-darwin8 -isystem $$JAGUAR_CXX/backward \
    -isystem $$JAGUAR_GCC/include -isystem $$TIGER_FIXED -isystem $$JAGUAR_SDK/usr/include \
    -iframework $$JAGUAR_SDK/System/Library/Frameworks
QMAKE_CC = /opt/jaguar-gcc/bin/powerpc-apple-darwin8-gcc
QMAKE_CXX = /opt/jaguar-gcc/bin/powerpc-apple-darwin8-g++
QMAKE_LINK = $$QMAKE_CXX
QMAKE_LINK_SHLIB = $$QMAKE_CXX
QMAKE_CFLAGS += $$JAGUAR_INC -fcommon -mdynamic-no-pic -mmacosx-version-min=10.2
QMAKE_CXXFLAGS += $$JAGUAR_INC -std=gnu++98 -fobjc-exceptions -mdynamic-no-pic -mmacosx-version-min=10.2
QMAKE_OBJECTIVE_CC = $$QMAKE_CXX
QMAKE_OBJECTIVE_CFLAGS += $$JAGUAR_INC -fcommon -std=gnu++98 -fobjc-exceptions -mdynamic-no-pic -mmacosx-version-min=10.2
# /opt/jaguar/link-10.4u holds only the 10.4u libSystem and libobjc stubs.
# Searched first, they keep the system libraries consistent with the 10.4u
# frameworks, whose dependencies the classic linker checks, while -lstdc++
# still finds the Jaguar compiler's static libstdc++. check-imports.sh then
# rejects any strong import that the 10.2.8 SDK does not export.
#
# CoreServices, Foundation and libobjc come first: the 10.4u umbrellas
# re-export them, so the linker would record FSPathMakeRef, Gestalt and the
# like as coming from ApplicationServices, and NSString or objc_msgSend as
# coming from AppKit, which on 10.2 do not provide them.
QMAKE_LFLAGS += -isysroot $$JAGUAR_SDK -L/opt/jaguar/link-10.4u -mmacosx-version-min=10.2 -Wl,-search_paths_first \
    -framework CoreServices -framework Foundation -lobjc
# SQLite's AFP and SMB locking styles call fsctl and srandomdev, both newer
# than 10.2; without them SQLite uses POSIX locks on every volume.
DEFINES += SQLITE_ENABLE_LOCKING_STYLE=0
QMAKE_CFLAGS_RELEASE = -Os
QMAKE_CXXFLAGS_RELEASE = -Os
QMAKE_AR = /opt/osxcross-ppc/target/bin/powerpc-apple-darwin8-ar cq
QMAKE_RANLIB = /opt/osxcross-ppc/target/bin/powerpc-apple-darwin8-ranlib
QMAKE_STRIP = /opt/osxcross-ppc/target/bin/powerpc-apple-darwin8-strip
QMAKE_FIX_RPATH = /opt/osxcross-ppc/target/bin/powerpc-apple-darwin8-install_name_tool -id
QMAKE_MACOSX_DEPLOYMENT_TARGET = 10.2
QMAKE_INCDIR_OPENGL = $$JAGUAR_SDK/System/Library/Frameworks/OpenGL.framework/Headers
QMAKE_INCDIR_OPENGL += $$JAGUAR_SDK/System/Library/Frameworks/AGL.framework/Headers
CONFIG -= incremental
