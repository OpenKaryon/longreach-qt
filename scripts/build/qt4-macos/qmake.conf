include(../macx-g++/qmake.conf)
QMAKE_CC = i386-apple-darwin8-clang
QMAKE_CXX = tiger-clang++
QMAKE_LINK = $$QMAKE_CXX
QMAKE_LINK_SHLIB = $$QMAKE_CXX
QMAKE_CFLAGS += -fcommon
QMAKE_CXXFLAGS += -std=gnu++98
# Qt4 uses one Objective-C compiler variable for both .m and .mm files.
QMAKE_OBJECTIVE_CC = $$QMAKE_CXX
QMAKE_OBJECTIVE_CFLAGS += -fcommon -std=gnu++98
QMAKE_CFLAGS_RELEASE = -Os
QMAKE_CXXFLAGS_RELEASE = -Os
QMAKE_AR = i386-apple-darwin8-ar cq
QMAKE_RANLIB = i386-apple-darwin8-ranlib
QMAKE_STRIP = i386-apple-darwin8-strip
QMAKE_FIX_RPATH = i386-apple-darwin8-install_name_tool -id
QMAKE_MACOSX_DEPLOYMENT_TARGET = 10.4
QMAKE_INCDIR_OPENGL = /opt/tiger-toolchain/SDK/MacOSX10.4u.sdk/System/Library/Frameworks/OpenGL.framework/Headers
QMAKE_INCDIR_OPENGL += /opt/tiger-toolchain/SDK/MacOSX10.4u.sdk/System/Library/Frameworks/AGL.framework/Headers
CONFIG -= incremental
