include(../android-clang/qmake.conf)

QMAKE_CC = /opt/longreach-android/bin/cc
QMAKE_CXX = /opt/longreach-android/bin/cxx
QMAKE_LINK = $$QMAKE_CXX
QMAKE_LINK_SHLIB = $$QMAKE_CXX
QMAKE_AR = llvm-ar-21 cqs
QMAKE_RANLIB = llvm-ranlib-21
QMAKE_STRIP = llvm-strip-21
QMAKE_CFLAGS_OPTIMIZE = -Oz
QMAKE_CFLAGS_OPTIMIZE_FULL = -Oz
QMAKE_CXXFLAGS_OPTIMIZE = -Oz
QMAKE_CXXFLAGS_OPTIMIZE_FULL = -Oz
ANDROID_TARGET_SDK_VERSION = 35
