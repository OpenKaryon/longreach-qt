MAKEFILE_GENERATOR = UNIX
CONFIG += incremental
QMAKE_INCREMENTAL_STYLE = sublib
include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/clang.conf)
QMAKE_CC = /opt/llvm-runtime-lucid/bin/target-cc
QMAKE_CXX = /opt/llvm-runtime-lucid/bin/target-cxx
QMAKE_LINK_C = $$QMAKE_CC
QMAKE_LINK_C_SHLIB = $$QMAKE_CC
QMAKE_LINK = $$QMAKE_CXX
QMAKE_LINK_SHLIB = $$QMAKE_CXX
QMAKE_AR = /opt/llvm-21/bin/llvm-ar cqs
QMAKE_OBJCOPY = /opt/llvm-21/bin/llvm-objcopy
QMAKE_NM = /opt/llvm-21/bin/llvm-nm -P
QMAKE_STRIP = /opt/llvm-21/bin/llvm-strip
QMAKE_LFLAGS += -no-pie
QMAKE_DEFAULT_LIBDIRS = /opt/llvm-runtime-lucid/lib /opt/sysroot-lucid/usr/local/lib /opt/sysroot-lucid/usr/lib /opt/sysroot-lucid/lib
load(qt_config)
