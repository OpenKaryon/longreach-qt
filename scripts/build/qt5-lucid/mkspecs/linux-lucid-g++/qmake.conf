#
# qmake configuration for the Ubuntu 10.04 Lucid amd64 and i386 targets: the kit's
# lucid-gcc/lucid-g++ wrappers point Ubuntu 16.04's GCC at the pinned Lucid
# sysroot and the static libstdc++ rebuilt against its glibc 2.11.
#
MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

QMAKE_CC                = lucid-gcc
QMAKE_CXX               = lucid-g++
QMAKE_LINK_C            = $$QMAKE_CC
QMAKE_LINK_C_SHLIB      = $$QMAKE_CC
QMAKE_LINK              = $$QMAKE_CXX
QMAKE_LINK_SHLIB        = $$QMAKE_CXX
QMAKE_LFLAGS           += -static-libgcc -static-libstdc++

load(qt_config)
